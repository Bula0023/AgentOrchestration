version: "3.9"

services:

  backend:
    build:
      context: ./backend
    container_name: agent-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - chroma
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      OLLAMA_URL: http://host.docker.internal:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_db
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"


  frontend:
    build:
      context: ./UI
    container_name: agent-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./UI:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_db
      
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"


  chroma:
    image: chromadb/chroma:latest
    container_name: agent-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma


volumes:

  redis_data:

  chroma_data:

  postgres_data: