apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: agent-ingress

spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agent-frontend-service
                port:
                  number: 5173

          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-backend-service
                port:
                  number: 8000