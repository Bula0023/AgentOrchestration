services:
  backend:
    build: ./backend
    container_name: agent-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_URL: http://host.docker.internal:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_db
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000

    depends_on:
      - redis
      - chroma
      - postgres
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - "--reload"


  frontend:
    build: ./UI
    container_name: agent-frontend
    ports:
      - "5173:5173"

  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:latest
    container_name: agent-chroma
    ports:
      - "8001:8000"